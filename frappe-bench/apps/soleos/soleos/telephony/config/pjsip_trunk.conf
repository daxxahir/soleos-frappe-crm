; ==============================================================================
; Soleos Telephony - External SIP Trunk Configuration (Audited Naming)
; Audited trunk names: 'trunk' (Production CRM Trunk) and 'trunk-voice-ai'
; Supports both Digest Authentication and IP-based Authentication.
; ==============================================================================

; ---------------------------------------------------------
; 1. Production CRM SIP Trunk ('trunk')
; ---------------------------------------------------------
; Registration (uncomment if provider requires SIP REGISTER):
; [trunk-reg]
; type=registration
; transport=transport-udp
; outbound_auth=trunk-auth
; server_uri=sip:<SIP_PROVIDER_HOST>
; client_uri=sip:<SIP_USERNAME>@<SIP_PROVIDER_HOST>
; retry_interval=60

[trunk-auth]
type=auth
auth_type=userpass
username=<SIP_USERNAME>
password=<SIP_PASSWORD>

[trunk-aor]
type=aor
contact=sip:<SIP_PROVIDER_HOST>:5060

[trunk]
type=endpoint
transport=transport-udp
context=from-trunk
disallow=all
allow=ulaw,alaw
aors=trunk-aor
outbound_auth=trunk-auth
from_domain=<SIP_PROVIDER_HOST>
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[trunk-identify]
type=identify
endpoint=trunk
match=<SIP_PROVIDER_IP>

; ---------------------------------------------------------
; 2. Voice AI Dedicated SIP Trunk ('trunk-voice-ai')
; ---------------------------------------------------------
; Registration (uncomment if provider requires SIP REGISTER):
; [trunk-voice-ai-reg]
; type=registration
; transport=transport-udp
; outbound_auth=trunk-voice-ai-auth
; server_uri=sip:<VOICE_AI_PROVIDER_HOST>
; client_uri=sip:<VOICE_AI_SIP_USERNAME>@<VOICE_AI_PROVIDER_HOST>
; retry_interval=60

[trunk-voice-ai-auth]
type=auth
auth_type=userpass
username=<VOICE_AI_SIP_USERNAME>
password=<VOICE_AI_SIP_PASSWORD>

[trunk-voice-ai-aor]
type=aor
contact=sip:<VOICE_AI_PROVIDER_HOST>:5060

[trunk-voice-ai]
type=endpoint
transport=transport-udp
context=voice-ai-answered
disallow=all
allow=opus,ulaw,alaw
aors=trunk-voice-ai-aor
outbound_auth=trunk-voice-ai-auth
from_domain=<VOICE_AI_PROVIDER_HOST>
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[trunk-voice-ai-identify]
type=identify
endpoint=trunk-voice-ai
match=<VOICE_AI_PROVIDER_IP>
