; ==============================================================================
; Soleos Telephony - LiveKit SIP Integration (Modular Peer)
; Connects Asterisk to LiveKit SIP Service for Voice AI pipeline
; ==============================================================================

[livekit-trunk]
type = endpoint
transport = transport-udp
context = soleos-voice-ai
disallow = all
allow = opus,ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
timers = yes
dtmf_mode = rfc4733
aors = livekit-aor

[livekit-aor]
type = aor
contact = sip:127.0.0.1:5062

[livekit-identify]
type = identify
endpoint = livekit-trunk
match = 127.0.0.1:5062
