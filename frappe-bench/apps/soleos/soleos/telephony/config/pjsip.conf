[global]
type=global
user_agent=Soleos-PBX-v1.0

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[endpoint-internal](!)
type=endpoint
context=soleos-internal
disallow=all
allow=ulaw,alaw,opus
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
timers=yes
dtmf_mode=rfc4733

[auth-userpass](!)
type=auth
auth_type=userpass

[aor-dynamic](!)
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30

[9101](endpoint-internal)
auth=auth9101
aors=9101
callerid="Agent 9101" <9101>

[auth9101](auth-userpass)
username=9101
password=SoleosPass9101!

[9101](aor-dynamic)

[9102](endpoint-internal)
auth=auth9102
aors=9102
callerid="Agent 9102" <9102>

[auth9102](auth-userpass)
username=9102
password=SoleosPass9102!

[9102](aor-dynamic)

[9103](endpoint-internal)
auth=auth9103
aors=9103
callerid="Agent 9103" <9103>

[auth9103](auth-userpass)
username=9103
password=SoleosPass9103!

[9103](aor-dynamic)

[9104](endpoint-internal)
auth=auth9104
aors=9104
callerid="Agent 9104" <9104>

[auth9104](auth-userpass)
username=9104
password=SoleosPass9104!

[9104](aor-dynamic)

