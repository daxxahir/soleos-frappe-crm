[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
RINGTIME=30
RECORDING_PATH=/var/recordings

; ==============================================================================
; Core Agent & Internal Context
; ==============================================================================
[soleos-internal]
; Audio Echo Diagnostic Test (9100)
exten => 9100,1,NoOp(Soleos Echo Audio Test for Extension ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; Internal Agent-to-Agent Calling (9101 to 9104)
exten => _910[1-4],1,NoOp(Internal Call: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CDR(userfield)=internal_agent_call)
 same => n,Set(CHANNEL(hangup_handler_push)=autodialer-hangup,s,1)
 same => n,Dial(PJSIP/${EXTEN},${RINGTIME},tTkK)
 same => n,Goto(s-${DIALSTATUS},1)

exten => s-NOANSWER,1,Hangup()
exten => s-BUSY,1,Busy(3)
exten => s-CHANUNAVAIL,1,Congestion(3)
exten => s-CONGESTION,1,Congestion(3)
exten => _s-.,1,Hangup()

; Include Verified Dialplan Contexts
include => soleos-queues
include => autodialer-microsip
include => voice-ai-originate
include => voice-ai-answered
include => conmutador-abel
include => from-trunk
include => soleos-outbound

; ==============================================================================
; Inbound DID Routing / CRM Inbound Resolve
; ==============================================================================
[from-trunk]
exten => _.,1,NoOp(Inbound Call from Trunk to DID ${EXTEN} from CID ${CALLERID(num)})
 same => n,Set(CDR(userfield)=inbound_crm_call)
 same => n,Set(CHANNEL(hangup_handler_push)=autodialer-hangup,s,1)
 same => n,Goto(soleos-queues,9200,1)

; ==============================================================================
; Support Queues
; ==============================================================================
[soleos-queues]
exten => 9200,1,NoOp(Support Queue Entry)
 same => n,Answer()
 same => n,Set(CHANNEL(hangup_handler_push)=autodialer-hangup,s,1)
 same => n,Queue(soleos-support-queue,t,,,60)
 same => n,Hangup()

; ==============================================================================
; Autodialer Outbound (FastAPI -> Spool -> AMD -> MixMonitor -> Agent Origination)
; ==============================================================================
[autodialer-microsip]
exten => s,1,NoOp(Autodialer Outbound Call Connected to ${CLIENT_NUMBER} for Log ${CRM_CALL_LOG})
 same => n,Set(CDR(userfield)=autodialer_call)
 same => n,Set(CHANNEL(hangup_handler_push)=autodialer-hangup,s,1)
 same => n,MixMonitor(${RECORDING_PATH}/${UNIQUEID}_${CLIENT_NUMBER}.wav,b)
 same => n,AMD()
 same => n,NoOp(AMD Result: ${AMDSTATUS} - Reason: ${AMDCAUSE})
 same => n,GotoIf($["${AMDSTATUS}" = "MACHINE"]?machine:human)
 same => n(human),NoOp(Human answered: Playing autodialer prompt and bridging agent)
 same => n,Playback(autodialer-1)
 same => n,Queue(soleos-support-queue,t,,,30)
 same => n,Hangup()
 same => n(machine),NoOp(Answering Machine detected: Marking disposition and hanging up)
 same => n,Set(CDR(disposition)=VOICEMAIL)
 same => n,Hangup()

exten => _[0-9].,1,NoOp(Autodialer Outbound Call to ${EXTEN})
 same => n,Set(CLIENT_NUMBER=${EXTEN})
 same => n,Goto(s,1)

; ==============================================================================
; Voice AI Originate Context (Dial PJSIP/...@trunk-voice-ai)
; ==============================================================================
[voice-ai-originate]
exten => _[0-9].,1,NoOp(Voice AI Outbound Originate to ${EXTEN} via trunk-voice-ai)
 same => n,Set(CDR(userfield)=voice_ai_outbound)
 same => n,Set(CHANNEL(hangup_handler_push)=autodialer-hangup,s,1)
 same => n,Dial(PJSIP/${EXTEN}@trunk-voice-ai,45,tT)
 same => n,Hangup()

; ==============================================================================
; Voice AI Answered Context (Stasis ARI Application Route)
; ==============================================================================
[voice-ai-answered]
exten => _.,1,NoOp(Voice AI Answered Route - Entering Stasis)
 same => n,Answer()
 same => n,Set(CHANNEL(hangup_handler_push)=autodialer-hangup,s,1)
 same => n,Stasis(voice-ai)
 same => n,Hangup()

exten => voice-ai,1,NoOp(Voice AI Direct Stasis Entry)
 same => n,Answer()
 same => n,Set(CHANNEL(hangup_handler_push)=autodialer-hangup,s,1)
 same => n,Stasis(voice-ai)
 same => n,Hangup()

; ==============================================================================
; Conmutador Abel (Optional LiveKit SIP -> Fallback)
; ==============================================================================
[conmutador-abel]
exten => _.,1,NoOp(Conmutador Abel Routing to LiveKit SIP)
 same => n,Dial(PJSIP/${EXTEN}@livekit-trunk,30,tT)
 same => n,Goto(s-${DIALSTATUS},1)
exten => s-NOANSWER,1,Goto(soleos-queues,9200,1)
exten => s-BUSY,1,Goto(soleos-queues,9200,1)
exten => s-CHANUNAVAIL,1,Goto(soleos-queues,9200,1)
exten => s-CONGESTION,1,Goto(soleos-queues,9200,1)
exten => _s-.,1,Hangup()

; ==============================================================================
; Autodialer Hangup Handler (CRM Call Log Finalization)
; ==============================================================================
[autodialer-hangup]
exten => s,1,NoOp(Call Finished. Duration: ${CDR(duration)}, Billsec: ${CDR(billsec)}, Status: ${CDR(disposition)})
 same => n,System(/usr/bin/python3 /home/soleos/frappe-bench/apps/soleos/soleos/telephony/crm_call_log_hook.py "${CDR(uniqueid)}" "${CDR(src)}" "${CDR(dst)}" "${CDR(duration)}" "${CDR(billsec)}" "${CDR(disposition)}" "${CDR(userfield)}" 2>&1 &)
 same => n,Return()

; Outbound trunk placeholder
[soleos-outbound]
#tryinclude extensions_trunk.conf
